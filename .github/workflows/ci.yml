name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketos
          POSTGRES_PASSWORD: marketos
          POSTGRES_DB: marketos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketos" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://marketos:marketos@localhost:5432/marketos_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations match models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^SCHEDULE_HEARTBEAT_SECONDS=.*/SCHEDULE_HEARTBEAT_SECONDS=10/' .env
      - run: docker compose up --build -d
      - name: API is ready and the web app renders it
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health/ready && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/health/ready
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ -o page.html && break
            sleep 3
          done
          grep -q "System status" page.html
      - name: Beat and worker record a heartbeat run
        run: |
          for i in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:8000/api/v1/system/runs?job_name=heartbeat" | grep -q '"succeeded"' && exit 0
            sleep 3
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
