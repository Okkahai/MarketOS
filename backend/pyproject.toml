[project]
name = "marketos-backend"
version = "0.1.0"
description = "MarketOS API, workers and paper trading engine (simulation only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.2",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "celery>=5.4,<6",
    "httpx>=0.27",
    "tzdata",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostgreSQL and Redis (TEST_DATABASE_URL / TEST_REDIS_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
